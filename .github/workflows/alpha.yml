name: Alpha

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: cloudledger-alpha-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare alpha release version
    runs-on: ubuntu-latest
    outputs:
      alpha_tag: ${{ steps.version.outputs.alpha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Select next alpha tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          existing_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')"
          alpha_tag="$(printf '%s\n' "$existing_tags" | bash deploy/next-alpha-tag.sh "$base_version")"
          while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${alpha_tag}" >/dev/null 2>&1; do
            existing_tags="${existing_tags}"$'\n'"${alpha_tag}"
            alpha_tag="$(printf '%s\n' "$existing_tags" | bash deploy/next-alpha-tag.sh "$base_version")"
          done
          printf 'Publishing alpha tag %s\n' "$alpha_tag"
          printf 'alpha_tag=%s\n' "$alpha_tag" >>"$GITHUB_OUTPUT"

  backend:
    name: Verify and publish alpha backend
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Verify production operations toolbox
        run: |
          bash -n deploy/next-alpha-tag.sh deploy/cloudledger-ops.sh deploy/tests/cloudledger-ops-test.sh deploy/tests/mock-command.sh deploy/tests/mock-read.bash deploy/docker/network-anchor.sh deploy/docker/postgres-init.sh deploy/verify-release-source.sh deploy/tests/release-workflow-test.sh
          nix run nixpkgs#shellcheck -- -S warning deploy/next-alpha-tag.sh deploy/cloudledger-ops.sh deploy/tests/cloudledger-ops-test.sh deploy/tests/mock-command.sh deploy/tests/mock-read.bash deploy/docker/network-anchor.sh deploy/docker/postgres-init.sh deploy/verify-release-source.sh deploy/tests/release-workflow-test.sh
          bash deploy/tests/cloudledger-ops-test.sh
          bash deploy/tests/release-workflow-test.sh

      - name: Check formatting
        run: nix develop path:. -c cargo fmt --all -- --check

      - name: Lint
        run: nix develop path:. -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: nix develop path:. -c cargo test --workspace --locked

      - name: Build alpha server binary
        run: nix develop path:. -c cargo build -p cloudledger-server --release --locked

      - name: Upload alpha server artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudledger-server-alpha-${{ github.sha }}
          path: target/release/cloudledger-server
          if-no-files-found: error
          retention-days: 7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate alpha server image metadata
        id: server-image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudledger-server
          tags: |
            type=raw,value=${{ needs.prepare.outputs.alpha_tag }}
            type=raw,value=alpha
            type=sha,prefix=alpha-,format=short

      - name: Build and publish alpha server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          push: true
          tags: ${{ steps.server-image.outputs.tags }}
          labels: ${{ steps.server-image.outputs.labels }}

      - name: Generate alpha PostgreSQL image metadata
        id: postgres-image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudledger-postgres
          tags: |
            type=raw,value=${{ needs.prepare.outputs.alpha_tag }}
            type=raw,value=alpha
            type=sha,prefix=alpha-,format=short

      - name: Build and publish alpha PostgreSQL image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.postgres
          push: true
          tags: ${{ steps.postgres-image.outputs.tags }}
          labels: ${{ steps.postgres-image.outputs.labels }}

      - name: Generate alpha Caddy image metadata
        id: caddy-image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudledger-caddy
          tags: |
            type=raw,value=${{ needs.prepare.outputs.alpha_tag }}
            type=raw,value=alpha
            type=sha,prefix=alpha-,format=short

      - name: Build and publish alpha Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.caddy
          push: true
          tags: ${{ steps.caddy-image.outputs.tags }}
          labels: ${{ steps.caddy-image.outputs.labels }}

      - name: Generate alpha network anchor image metadata
        id: anchor-image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudledger-network-anchor
          tags: |
            type=raw,value=${{ needs.prepare.outputs.alpha_tag }}
            type=raw,value=alpha
            type=sha,prefix=alpha-,format=short

      - name: Build and publish alpha network anchor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.anchor
          push: true
          tags: ${{ steps.anchor-image.outputs.tags }}
          labels: ${{ steps.anchor-image.outputs.labels }}

  android:
    name: Build alpha Android app
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Build signed alpha universal APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          key_store="$RUNNER_TEMP/cloudledger-alpha.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          export ANDROID_KEYSTORE_PATH="$key_store"
          nix develop path:. -c npm ci
          nix develop path:. -c npm run tauri:android:build -- --target aarch64

      - name: Upload alpha APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudledger-android-${{ needs.prepare.outputs.alpha_tag }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish alpha GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, backend, android]
    steps:
      - name: Download alpha APK
        uses: actions/download-artifact@v4
        with:
          name: cloudledger-android-${{ needs.prepare.outputs.alpha_tag }}
          path: release-assets

      - name: Publish alpha prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.alpha_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.alpha_tag }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-assets/*.apk
