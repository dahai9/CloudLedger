name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is from its matching release branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash deploy/verify-release-source.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Verify app version matches release tag
        run: |
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$GITHUB_REF_NAME" = "v$app_version"

      - name: Verify versioned release notes
        env:
          RELEASE_NOTES_PATH: docs/releases/${{ github.ref_name }}.md
        run: |
          test -s "$RELEASE_NOTES_PATH"
          grep -Fxq "# CloudLedger $GITHUB_REF_NAME" "$RELEASE_NOTES_PATH"
          grep -q '^## ' "$RELEASE_NOTES_PATH"
          awk 'NF && $0 !~ /^#/ { found = 1 } END { exit !found }' "$RELEASE_NOTES_PATH"

      - name: Build signed universal APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          key_store="$RUNNER_TEMP/cloudledger-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          export ANDROID_KEYSTORE_PATH="$key_store"
          nix develop path:. -c npm ci
          nix develop path:. -c npm run tauri:android:build -- --target aarch64

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudledger-android-${{ github.ref_name }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 7
