[workspace]
resolver = "2"
members = [
  "crates/cloudledger-core",
  "crates/cloudledger-db",
  "crates/cloudledger-service",
  "crates/cloudledger-server",
  "src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
cloudledger-core = { path = "crates/cloudledger-core" }
cloudledger-db = { path = "crates/cloudledger-db" }
cloudledger-service = { path = "crates/cloudledger-service" }
hex = "0.4"
hmac = "0.12"
ipnet = { version = "2", features = ["serde"] }
rand_core = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "time", "uuid", "json", "macros", "migrate"] }
subtle = "2"
tauri = "2"
tauri-build = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
