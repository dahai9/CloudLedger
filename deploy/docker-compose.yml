services:
  network-anchor:
    image: ${CLOUDLEDGER_ANCHOR_IMAGE:?Set CLOUDLEDGER_ANCHOR_IMAGE to a GHCR image tag}
    restart: unless-stopped
    ports:
      # xray may own public port 80. Keep the origin HTTP listener private and
      # use public HTTPS as the only Internet-facing CloudLedger endpoint.
      - "${CLOUDLEDGER_HTTP_PUBLISH:-127.0.0.1:18080:80}"
      - "${CLOUDLEDGER_HTTPS_PUBLISH:-443:443}"
      # Relay host loopback to the backend's namespace-loopback-only listener.
      - "127.0.0.1:8788:18788"

  cloudledger:
    image: ${CLOUDLEDGER_SERVER_IMAGE:?Set CLOUDLEDGER_SERVER_IMAGE to a GHCR image tag}
    network_mode: service:network-anchor
    restart: unless-stopped
    command: ["--config", "/etc/cloudledger/server.toml"]
    depends_on:
      network-anchor:
        condition: service_started
    volumes:
      - /etc/cloudledger/server.toml:/etc/cloudledger/server.toml
      - cloudledger-data:/var/lib/cloudledger

  postgres:
    image: ${CLOUDLEDGER_POSTGRES_IMAGE:?Set CLOUDLEDGER_POSTGRES_IMAGE to a GHCR image tag}
    network_mode: service:network-anchor
    restart: unless-stopped
    depends_on:
      network-anchor:
        condition: service_started
    environment:
      POSTGRES_DB: cloudledger
      POSTGRES_USER: cloudledger_bootstrap
      POSTGRES_PASSWORD: ${CLOUDLEDGER_BOOTSTRAP_DB_PASSWORD:?Set CLOUDLEDGER_BOOTSTRAP_DB_PASSWORD}
      CLOUDLEDGER_MIGRATION_DB_PASSWORD: ${CLOUDLEDGER_MIGRATION_DB_PASSWORD:?Set CLOUDLEDGER_MIGRATION_DB_PASSWORD}
      CLOUDLEDGER_RUNTIME_DB_PASSWORD: ${CLOUDLEDGER_RUNTIME_DB_PASSWORD:?Set CLOUDLEDGER_RUNTIME_DB_PASSWORD}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=cloudledger_bootstrap --dbname=cloudledger"]
      interval: 10s
      timeout: 5s
      retries: 10

  migration:
    image: ${CLOUDLEDGER_SERVER_IMAGE:?Set CLOUDLEDGER_SERVER_IMAGE to a GHCR image tag}
    profiles: ["migration"]
    network_mode: service:network-anchor
    command: ["migrate", "--config", "/etc/cloudledger/server.toml"]
    environment:
      CLOUDLEDGER_MIGRATION_DATABASE_URL: postgres://cloudledger_migration:${CLOUDLEDGER_MIGRATION_DB_PASSWORD:?Set CLOUDLEDGER_MIGRATION_DB_PASSWORD}@127.0.0.1:5432/cloudledger
    volumes:
      # The first migration persists generated admin and audit credentials in
      # this UID 10001-owned private config file before applying the schema.
      - /etc/cloudledger/server.toml:/etc/cloudledger/server.toml
    depends_on:
      network-anchor:
        condition: service_started
      postgres:
        condition: service_healthy

  caddy:
    image: ${CLOUDLEDGER_CADDY_IMAGE:?Set CLOUDLEDGER_CADDY_IMAGE to a GHCR image tag}
    network_mode: service:network-anchor
    restart: unless-stopped
    depends_on:
      network-anchor:
        condition: service_started
    environment:
      CLOUDLEDGER_API_DOMAIN: ${CLOUDLEDGER_API_DOMAIN:?Set CLOUDLEDGER_API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CLOUDLEDGER_CADDY_ORIGIN_CERT_PATH:?Set CLOUDLEDGER_CADDY_ORIGIN_CERT_PATH}:/etc/caddy/origin/origin-cert.pem:ro
      - ${CLOUDLEDGER_CADDY_ORIGIN_KEY_PATH:?Set CLOUDLEDGER_CADDY_ORIGIN_KEY_PATH}:/etc/caddy/origin/origin-key.pem:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cloudledger-data:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  default:
    name: cloudledger-origin
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: cld-origin0
