[package]
name = "cloudledger-db"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
sqlite = [
    "cloudledger-core/serde",
    "dep:rusqlite",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
cloudledger-core = { path = "../cloudledger-core" }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
